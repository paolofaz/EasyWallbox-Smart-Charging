name: Mark RC 0.3.0rc2 as prerelease
on:
  push:
    branches: [RC]
    paths: [".github/workflows/mark-rc2-prerelease-once.yml"]

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Keep experimental RC out of stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v0.3.0rc2 --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view v0.3.0rc2 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' | grep -x true
