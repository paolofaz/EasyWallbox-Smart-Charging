name: Publish verified RC 0.3.0rc4
on:
  push:
    branches: [RC]
    paths: [".github/workflows/publish-rc4-once.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - run: python -m pip install "voluptuous>=0.15,<1"
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  publish:
    runs-on: ubuntu-latest
    needs: [python, hassfest, marketplace]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify all user-visible changes are in this commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("custom_components/easywallbox_smart")
          assert json.loads((root/"manifest.json").read_text())["version"] == "0.3.0rc4"
          assert (root/"number.py").exists()
          assert (root/"device.py").exists()
          code = (root/"rc_controller.py").read_text()
          assert 'if kind == "soc_stop":' in code
          assert 'self._soc_stop_done = True' in code
          assert 'SOC_STOP_REFRESH_INTERVAL = timedelta(minutes=20)' in code
          for name in ("sensor", "switch", "time", "datetime", "button", "select", "number"):
              assert "controller_device_info(entry)" in (root/(name+".py")).read_text()
          PY
      - name: Create exactly one RC prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0rc4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists already: do not overwrite"
            exit 1
          fi
          gh release create v0.3.0rc4 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EasyWallbox Smart Charging 0.3.0rc4 — SOC e Dispositivi" \
            --notes-file docs/RELEASE_RC_0_3_0rc4.md \
            --prerelease
          gh release edit v0.3.0rc4 --repo "$GITHUB_REPOSITORY" --prerelease
          gh release view v0.3.0rc4 --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' | grep -x true
