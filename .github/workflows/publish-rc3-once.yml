name: Publish verified RC 0.3.0rc3
on:
  push:
    branches: [RC]
    paths: [".github/workflows/publish-rc3-once.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.version }}
      - run: python -m pip install "voluptuous>=0.15,<1"
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
  publish:
    runs-on: ubuntu-latest
    needs: [python, hassfest, marketplace]
    if: github.ref_name == 'RC'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm version and guided vehicle controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("custom_components/easywallbox_smart")
          assert json.loads((root/"manifest.json").read_text())["version"]=="0.3.0rc3"
          cf=(root/"config_flow.py").read_text()
          assert '"planning_rate_kw"' not in cf
          assert all(x in cf for x in ("async_step_add_vehicle","async_step_edit_vehicle","async_step_remove_vehicle"))
          PY
      - name: Publish immutable 0.3.0rc3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0rc3 >/dev/null 2>&1; then
            echo "Release already exists; do not overwrite"
            exit 1
          fi
          gh release create v0.3.0rc3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EasyWallbox Smart Charging v0.3.0rc3 — planner e auto" \
            --notes-file docs/RELEASE_RC_0_3_0rc3.md \
            --prerelease
          gh release view v0.3.0rc3 --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq '.isPrerelease' | grep -x true
