name: Publish corrective 0.3.0rc2 prerelease
on:
  push:
    branches: [RC]
    paths: [".github/workflows/publish-rc2-once.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  publish:
    runs-on: ubuntu-latest
    needs: [test, hassfest, marketplace]
    if: github.ref_name == 'RC'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm exact version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("custom_components/easywallbox_smart/manifest.json").read_text())
          assert data["version"] == "0.3.0rc2"
          PY
      - name: Create one immutable corrective prerelease tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0rc2 >/dev/null 2>&1; then
            echo "Existing tag: will not overwrite previously published version."
            exit 1
          fi
          gh release create v0.3.0rc2 \
            --target "$GITHUB_SHA" \
            --title "EasyWallbox Smart Charging 0.3.0rc2 — Config Flow corretto" \
            --notes "RC sperimentale con controllo reale opzionale e OFF al riavvio. Configurazione libera di 1..N sensori domestici, selezione guidata target SOC fisso o da entità, eliminazione completa del laboratorio e dei riferimenti storici nell'interfaccia. Per la prima prova verificare il Config Flow e disabilitare le automazioni concorrenti; nessun collaudo elettrico reale è stato ancora eseguito. Dashboard auto-installata NON inclusa: controllo dalle entità HA. README e checklist nel repository."
