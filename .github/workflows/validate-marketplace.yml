name: Marketplace HACS validation

on:
  push:
    branches:
      - stabilizzatore-m1
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS / Marketplace repository validation
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"
