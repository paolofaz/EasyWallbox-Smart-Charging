name: EasyWallbox Smart Charging 1.0 quality gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m pip install "voluptuous>=0.15,<1"
      - run: python -m unittest discover -s tests -v
      - name: Check JSON and translations
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==2026.11.1"
      - run: python tests/ha_field_trial.py
  publish-rc:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Release 1.0.0rc5'
    needs: [tests, hassfest, marketplace, ha-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish tested 1.0 release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version custom_components/easywallbox_smart/manifest.json)
          test "$version" = "1.0.0rc5"
          gh release create "v$version" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "EasyWallbox Smart Charging 1.0 RC5" --notes "Release candidate 1.0 RC5 (supersedes RC4): independent energy/minute counter summation and archive diagnostics, auto refreshing history card; archivio corretto per distacco dopo molte ore con BLE e Charging invariati; nuovo calcolo ETA informativo a due regimi, potenza libera misurata e attuale su 30 minuti, apprendimento AC/SOC limitato, previsione stabilizzata. Stima della partenza usata dalle decisioni invariata. Storico ricariche persistente per collegamento fisico, somma di piu segmenti con reset contatori, automobile, durata in ore/minuti. Separazione potenza massima contrattuale (solo calcoli) e DPM fisico (solo firmware); Start-Stop controllato esclusivamente tramite switch con Charge Enabled come conferma. Il DPM numerico non e letto o scritto da Smart Charging. Soglie dello stabilizzatore invariate. Serve associare Charge Enabled nelle opzioni dopo upgrade, verificare dpm_default ESPHome e svolgere il collaudo reale prima della versione stabile."
