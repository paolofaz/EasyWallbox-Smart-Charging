name: EasyWallbox Smart Charging 1.0 quality gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m pip install "voluptuous>=0.15,<1"
      - run: python -m unittest discover -s tests -v
      - name: Check JSON and translations
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
  ha-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==2026.11.1"
      - run: python tests/ha_field_trial.py
  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, hassfest, marketplace, ha-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish exact tested stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" || exit 0
          version=$(jq -r .version custom_components/easywallbox_smart/manifest.json)
          notes="docs/releases/v${version}.md"
          test -f "$notes" || exit 0
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --latest --title "EasyWallbox Smart Charging $version" --notes-file "$notes"
