name: M1-M2 offline checks
on:
  push:
    branches:
      - stabilizzatore-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Compile all integration Python modules
        run: python -m compileall -q custom_components/easywallbox_smart
      - name: Validate JSON metadata and translations
        run: |
          python -m json.tool custom_components/easywallbox_smart/manifest.json > /dev/null
          python -m json.tool hacs.json > /dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json > /dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json > /dev/null
