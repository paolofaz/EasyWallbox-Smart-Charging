name: Publish one-time RC 0.3.0rc1 prerelease

# This job runs only when THIS file itself is first committed/changed on RC.
# It never publishes main and never republishes arbitrary subsequent commits.
on:
  push:
    branches: [RC]
    paths: [".github/workflows/publish-rc-once.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q custom_components/easywallbox_smart tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m json.tool custom_components/easywallbox_smart/manifest.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/strings.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/it.json >/dev/null
          python -m json.tool custom_components/easywallbox_smart/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  publish:
    runs-on: ubuntu-latest
    needs: [tests, hassfest, marketplace]
    if: github.ref_name == 'RC'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm manifest is the prerelease version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path("custom_components/easywallbox_smart/manifest.json").read_text())["version"]
          assert version == "0.3.0rc1", f"Unexpected manifest version: {version}"
          PY
      - name: Create a GitHub PRE-RELEASE from this exact RC commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0rc1 >/dev/null 2>&1; then
            echo "Tag v0.3.0rc1 already released: refusing to replace it"
            exit 1
          fi
          gh release create v0.3.0rc1 \
            --target "$GITHUB_SHA" \
            --title "EasyWallbox Smart Charging 0.3.0rc1 — RC supervisionata" \
            --notes-file docs/RELEASE_RC_0_3_0rc1.md \
            --prerelease
