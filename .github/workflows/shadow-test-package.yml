name: Johnny dual-shadow test package

on:
  push:
    branches:
      - stabilizzatore-m1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify simulation and safety tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration
        run: python -m compileall -q custom_components/easywallbox_smart
      - name: Package ONLY Home Assistant integration files
        run: |
          mkdir -p dist
          cp -a custom_components/easywallbox_smart dist/easywallbox_smart
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist -type f -name '*.pyc' -delete
          test -f dist/easywallbox_smart/manifest.json
          test -f dist/easywallbox_smart/shadow_lab.py
          test -f dist/easywallbox_smart/shadow_log.py
      - name: Upload opt-in field-test installation folder
        uses: actions/upload-artifact@v4
        with:
          name: easywallbox-shadow-0.2.0b2
          path: dist/
          if-no-files-found: error
          retention-days: 14
