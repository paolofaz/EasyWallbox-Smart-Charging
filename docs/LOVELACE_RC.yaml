# EasyWallbox Smart Charging RC — dashboard Lovelace nativa
# Copiare questa vista nell'editor RAW dopo la prima installazione.
# Sostituire OGNI segnaposto con gli entity_id effettivi mostrati in HA.
# Sono placeholder dichiarati: non rappresentano entity_id reali.
title: EasyWallbox RC
views:
  - title: Johnny RC
    path: johnny-rc
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gestione della ricarica
            heading_style: title
            icon: mdi:shield-check
          - type: tile
            entity: select.SOSTITUIRE_MODALITA
            name: Automatico / Manuale
            features:
              - type: select-options
          - type: tile
            entity: switch.SOSTITUIRE_CONTROLLO_REALE
            name: Controllo reale (OFF dopo riavvio)
          - type: tile
            entity: sensor.SOSTITUIRE_JOHNNY_RC
            name: Stato Johnny
            icon: mdi:car-cog
          - type: tile
            entity: sensor.SOSTITUIRE_PIANIFICATORE
            name: Pianificatore
            icon: mdi:calendar-clock
          - type: tile
            entity: binary_sensor.SOSTITUIRE_CAVO_WALLBOX
            name: Cavo collegato alla wallbox
          - type: tile
            entity: binary_sensor.SOSTITUIRE_RICARICA_WALLBOX
            name: Ricarica effettiva

      - type: grid
        cards:
          - type: heading
            heading: Programmazione e partenza
            heading_style: title
            icon: mdi:clock-outline
          - type: tile
            entity: switch.SOSTITUIRE_POSTICIPO
            name: Avvio posticipato
          - type: tile
            entity: time.SOSTITUIRE_ORA_INIZIO
            name: Ora di avvio preferita
          - type: tile
            entity: datetime.SOSTITUIRE_OVERRIDE_PARTENZA
            name: Override prossima partenza
          - type: tile
            entity: button.SOSTITUIRE_CARICA_SUBITO
            name: Carica subito
          - type: tile
            entity: button.SOSTITUIRE_ANNULLA_OVERRIDE
            name: Annulla override
          - type: tile
            entity: button.SOSTITUIRE_PAUSA_GESTIONE
            name: Pausa gestione (non fisica)
          - type: tile
            entity: button.SOSTITUIRE_RIPRENDI_GESTIONE
            name: Riprendi gestione

      - type: grid
        cards:
          - type: heading
            heading: Wallbox e diagnostica
            heading_style: title
            icon: mdi:ev-station
          - type: tile
            entity: number.SOSTITUIRE_CHARGE_POWER
            name: Limite EV richiesto
          - type: tile
            entity: sensor.SOSTITUIRE_POWER_SET
            name: Limite EV confermato
          - type: tile
            entity: switch.SOSTITUIRE_START_STOP
            name: Start-Stop ESPHome (DPM 0 A)
          - type: tile
            entity: binary_sensor.SOSTITUIRE_CHARGE_ENABLED
            name: Charge Enabled confermato
          - type: tile
            entity: binary_sensor.SOSTITUIRE_DPM_ACTIVE
            name: DPM Active
          - type: tile
            entity: sensor.SOSTITUIRE_DPM_CONFIRMED
            name: DPM limite confermato
          - type: tile
            entity: sensor.SOSTITUIRE_COMMAND_STATUS
            name: Ultima conferma BLE
          - type: tile
            entity: binary_sensor.SOSTITUIRE_FAULT
            name: Fault
          - type: tile
            entity: binary_sensor.SOSTITUIRE_TELEMETRY_FRESH
            name: Telemetria ESPHome
          - type: tile
            entity: switch.SOSTITUIRE_LAB
            name: Laboratorio H24, senza comandi

      - type: grid
        cards:
          - type: heading
            heading: Auto e consumi reali
            heading_style: title
            icon: mdi:chart-line
          - type: tile
            entity: sensor.SOSTITUIRE_SOC_FIAT
            name: SOC Fiat 500e
          - type: tile
            entity: sensor.SOSTITUIRE_SOC_KIA
            name: SOC Kia EV3
          - type: tile
            entity: sensor.SOSTITUIRE_SHELLY_EV
            name: Assorbimento wallbox
          - type: history-graph
            title: Carichi domestici e potenza di ricarica
            hours_to_show: 8
            entities:
              - entity: sensor.SOSTITUIRE_SHELLY_PIANO_TERRA
              - entity: sensor.SOSTITUIRE_SHELLY_PIANO_PRIMO
              - entity: sensor.SOSTITUIRE_SHELLY_EV
